[project]
name = "herald"
version = "0.1.0"
description = "From tickets to status — automated weekly R/Y/G feature reporting for managers and leads"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "anthropic[vertex]>=0.52",
    "pyadf==0.5.2",
    "textual>=3.0",
]
[project.scripts]
herald = "herald.cli:cli"
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[dependency-groups]
dev = ["pytest>=7.0"]
